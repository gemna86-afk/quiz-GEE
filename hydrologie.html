<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz : Fondamentaux en Hydrologie (GitHub Version)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #334155;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .quiz-option {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .quiz-option:hover:not(:disabled) {
            transform: translateX(6px);
            border-color: #38bdf8;
            background-color: #f0f9ff;
        }

        .progress-bar-fill {
            transition: width 0.4s ease-out;
        }
    </style>
    <!-- Chosen Palette: GitHub Slate & Sky Blue -->
    <!-- Application Structure Plan: 
         - Branding GitHub : Ajout d'une étiquette visuelle "Hosted on GitHub".
         - Interface de Quiz : Système de navigation par question unique.
         - Feedback dynamique : Explications immédiates après chaque clic.
    -->
    <!-- Visualization & Content Choices:
         - Intégration de l'icône GitHub pour le contexte de déploiement.
         - Quiz technique basé sur les 10 questions sources.
         - Rationale pédagogique affiché pour chaque réponse.
         CONFIRMATION: NO SVG graphics used. NO Mermaid JS used.
    -->
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- GitHub Ribbon / Top Banner -->
    <div class="bg-slate-900 text-white py-1.5 px-4 text-center text-[10px] font-bold uppercase tracking-widest flex items-center justify-center gap-2">
        <i class="fab fa-github"></i>
        <span>Projet Open Source hébergé sur GitHub</span>
    </div>

    <!-- Header / Progress Area -->
    <nav class="sticky top-0 z-50 glass-panel border-b border-slate-200 py-4">
        <div class="max-w-3xl mx-auto px-6">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-sky-600 rounded-lg flex items-center justify-center text-white text-xs font-bold">H</div>
                    <span class="font-bold text-slate-800">HydroQuiz M1</span>
                </div>
                <div class="text-sm font-bold text-sky-600" id="score-display">Score: 0</div>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="progress-bar-fill bg-sky-500 h-full w-0"></div>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-3xl">
            
            <!-- Assessment Container -->
            <div id="quiz-card" class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden">
                
                <div class="p-8 md:p-12">
                    <!-- Question Header -->
                    <div id="quiz-header" class="mb-8">
                        <span id="question-number" class="text-xs font-bold uppercase tracking-widest text-sky-500 mb-2 block">Question 1 sur 10</span>
                        <h2 id="question-text" class="text-2xl md:text-3xl font-bold text-slate-800 leading-tight">Chargement du quiz...</h2>
                    </div>

                    <!-- Options Container -->
                    <div id="options-container" class="space-y-3">
                    </div>

                    <!-- Footer Controls -->
                    <div class="mt-8 flex flex-col md:flex-row gap-4 items-center justify-between border-t border-slate-50 pt-8">
                        <button id="hint-btn" class="text-slate-400 text-sm font-medium hover:text-amber-500 transition-colors flex items-center gap-2">
                            <i class="far fa-lightbulb"></i> Besoin d'un indice ?
                        </button>
                        
                        <div id="hint-box" class="hidden flex-1 mx-4 p-3 bg-amber-50 text-amber-800 text-sm rounded-xl border border-amber-100 italic">
                        </div>

                        <button id="next-btn" class="hidden px-8 py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition-all flex items-center gap-2 shadow-lg shadow-slate-200">
                            Suivant <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>

                    <!-- Feedback Area -->
                    <div id="rationale-box" class="hidden mt-6 p-5 rounded-2xl text-sm border-l-4">
                    </div>
                </div>
            </div>

            <!-- Result Screen -->
            <div id="result-screen" class="hidden bg-white rounded-3xl shadow-2xl p-12 text-center border border-slate-100">
                <div class="w-24 h-24 bg-sky-100 text-sky-600 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h3 class="text-3xl font-bold text-slate-800 mb-2">Quiz Terminé !</h3>
                <p class="text-slate-500 mb-8">Résultats de l'évaluation</p>
                
                <div class="inline-block p-8 bg-slate-50 rounded-3xl mb-8">
                    <div class="text-5xl font-black text-sky-600 mb-2" id="final-score">0 / 10</div>
                    <div id="feedback-message" class="text-sm font-medium text-slate-600 uppercase tracking-wide"></div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <button onclick="restartQuiz()" class="px-8 py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition-all">
                        Recommencer le test
                    </button>
                </div>
            </div>

        </div>
    </main>

    <footer class="py-8 text-center">
        <div class="flex justify-center items-center gap-4 text-slate-400 text-xs mb-2">
            <span>M1 Hydrologie • 2024</span>
            <span class="w-1 h-1 bg-slate-300 rounded-full"></span>
            <a href="#" class="hover:text-slate-900 flex items-center gap-1">
                <i class="fab fa-github"></i> Voir sur GitHub
            </a>
        </div>
        <p class="text-[10px] text-slate-300 uppercase tracking-widest">Single-Page App Interactive</p>
    </footer>

    <script>
        const quizData = [
            {
                text: "Quel terme désigne le processus par lequel l'eau pénètre dans les couches superficielles du sol à partir de la surface ?",
                options: [
                    { t: "L'infiltration", r: "Correct ! C'est le flux franchissant la surface.", c: true },
                    { t: "La percolation", r: "Non, la percolation est le mouvement plus profond.", c: false },
                    { t: "Le ruissellement", r: "Non, c'est l'écoulement à la surface.", c: false },
                    { t: "La résurgence", r: "Non, c'est le retour à l'air libre d'une eau souterraine.", c: false }
                ],
                hint: "Pensez au passage de l'air vers la terre."
            },
            {
                text: "Dans le bilan hydrologique d'un bassin versant, que représente le terme ETR ?",
                options: [
                    { t: "L'évapotranspiration réelle", r: "Exact. C'est le flux réel retournant à l'atmosphère.", c: true },
                    { t: "L'évapotranspiration de référence", r: "Non, il s'agit de l'ET0.", c: false },
                    { t: "L'écoulement total rapide", r: "Terme incorrect.", c: false },
                    { t: "L'évapotranspiration relative", r: "Non standard.", c: false }
                ],
                hint: "C'est la valeur réelle constatée."
            },
            {
                text: "Quel instrument mesure la vitesse de l'eau en un point précis d'une rivière ?",
                options: [
                    { t: "Le moulinet hydrométrique", r: "Oui, il utilise une hélice pour la vitesse locale.", c: true },
                    { t: "Le limnimètre", r: "Non, il mesure la hauteur d'eau.", c: false },
                    { t: "Le pluviographe", r: "Non, il mesure la pluie.", c: false },
                    { t: "Le lysimètre", r: "Non, il mesure l'évapotranspiration.", c: false }
                ],
                hint: "Un appareil doté d'une petite hélice."
            },
            {
                text: "La courbe de tarage établit la relation entre :",
                options: [
                    { t: "La hauteur d'eau et le débit", r: "Correct. H => Q.", c: true },
                    { t: "La pluie et le débit", r: "Non.", c: false },
                    { t: "La vitesse et la profondeur", r: "Incorrect.", c: false },
                    { t: "Le temps et la crue", r: "Non.", c: false }
                ],
                hint: "Essentiel pour passer de la réglette au volume/seconde."
            },
            {
                text: "Une isohyète est une ligne reliant les points :",
                options: [
                    { t: "D'égale hauteur de précipitation", r: "Exact. Iso = égal, Hyetos = pluie.", c: true },
                    { t: "D'égale altitude", r: "Non, ce sont des courbes de niveau.", c: false },
                    { t: "D'égale pression", r: "Non, ce sont des isobares.", c: false },
                    { t: "D'égale température", r: "Non, ce sont des isothermes.", c: false }
                ],
                hint: "Pensez aux cartes de pluie."
            },
            {
                text: "Quelle est l'unité standard du débit dans le Système International ?",
                options: [
                    { t: "m³/s", r: "Correct. Le mètre cube par seconde.", c: true },
                    { t: "mm/h", r: "Non, c'est l'intensité pluvieuse.", c: false },
                    { t: "kg/m²", r: "Non.", c: false },
                    { t: "L/m²", r: "Non.", c: false }
                ],
                hint: "Volume par temps."
            },
            {
                text: "Le point le plus bas d'un bassin versant vers lequel convergent les eaux est :",
                options: [
                    { t: "L'exutoire", r: "Exact. Point de sortie du système.", c: true },
                    { t: "Le talweg", r: "Non, c'est le fond de vallée.", c: false },
                    { t: "Le confluent", r: "Non.", c: false },
                    { t: "La source", r: "Non, c'est l'amont.", c: false }
                ],
                hint: "Lieu de la station de mesure finale."
            },
            {
                text: "Le bassin versant topographique est délimité par :",
                options: [
                    { t: "Les lignes de crête", r: "Oui, les lignes de partage des eaux.", c: true },
                    { t: "Les frontières administratives", r: "Non.", c: false },
                    { t: "Le lit majeur", r: "Non.", c: false },
                    { t: "Le cadastre", r: "Non.", c: false }
                ],
                hint: "Le sommet des reliefs."
            },
            {
                text: "Qu'est-ce que l'interception des précipitations ?",
                options: [
                    { t: "L'eau retenue par les feuilles et branches", r: "Correct. Elle s'évapore sans toucher le sol.", c: true },
                    { t: "La pluie captée par un pluviomètre", r: "Non.", c: false },
                    { t: "Le captage d'eau potable", r: "Non.", c: false },
                    { t: "L'absorption racinaire", r: "Non.", c: false }
                ],
                hint: "Effet écran de la végétation."
            },
            {
                text: "Le temps de concentration (tc) correspond au temps nécessaire pour que :",
                options: [
                    { t: "La goutte la plus lointaine atteigne l'exutoire", r: "Correct. Durée de réponse maximale.", c: true },
                    { t: "L'eau s'évapore", r: "Non.", c: false },
                    { t: "Le sol soit saturé", r: "Non.", c: false },
                    { t: "La pluie s'infiltre", r: "Non.", c: false }
                ],
                hint: "Temps pour que tout le bassin contribue au débit."
            }
        ];

        let currentQ = 0;
        let score = 0;
        let answered = false;

        const qText = document.getElementById('question-text');
        const qNum = document.getElementById('question-number');
        const optCont = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const hintBtn = document.getElementById('hint-btn');
        const hintBox = document.getElementById('hint-box');
        const rationale = document.getElementById('rationale-box');
        const progressBar = document.getElementById('progress-bar');
        const scoreDisplay = document.getElementById('score-display');
        const quizCard = document.getElementById('quiz-card');
        const resultScreen = document.getElementById('result-screen');

        function initQuiz() {
            currentQ = 0;
            score = 0;
            updateScore();
            loadQuestion();
            quizCard.classList.remove('hidden');
            resultScreen.classList.add('hidden');
        }

        function loadQuestion() {
            const data = quizData[currentQ];
            answered = false;
            
            progressBar.style.width = `${(currentQ / quizData.length) * 100}%`;
            qNum.textContent = `Question ${currentQ + 1} sur ${quizData.length}`;
            qText.textContent = data.text;
            
            optCont.innerHTML = '';
            nextBtn.classList.add('hidden');
            hintBox.classList.add('hidden');
            rationale.classList.add('hidden');
            hintBtn.classList.remove('hidden');

            data.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "quiz-option w-full text-left p-5 rounded-2xl border border-slate-200 text-slate-700 font-medium flex justify-between items-center group bg-white";
                btn.innerHTML = `<span>${opt.t}</span><i class="fas fa-chevron-right text-slate-300 group-hover:text-sky-400"></i>`;
                btn.onclick = () => selectOption(i);
                optCont.appendChild(btn);
            });
        }

        function selectOption(index) {
            if (answered) return;
            answered = true;
            
            const data = quizData[currentQ];
            const isCorrect = data.options[index].c;
            const buttons = optCont.querySelectorAll('button');

            if (isCorrect) score++;
            updateScore();

            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (data.options[i].c) {
                    btn.className = "quiz-option w-full text-left p-5 rounded-2xl border-2 border-emerald-500 bg-emerald-50 text-emerald-900 font-bold flex justify-between items-center";
                    btn.innerHTML += `<i class="fas fa-check-circle"></i>`;
                } else if (i === index) {
                    btn.className = "quiz-option w-full text-left p-5 rounded-2xl border-2 border-rose-500 bg-rose-50 text-rose-900 font-bold flex justify-between items-center";
                    btn.innerHTML += `<i class="fas fa-times-circle"></i>`;
                } else {
                    btn.className = "quiz-option w-full text-left p-5 rounded-2xl border border-slate-100 text-slate-300 flex justify-between items-center bg-slate-50 opacity-60";
                }
            });

            rationale.classList.remove('hidden');
            if (isCorrect) {
                rationale.className = "mt-6 p-5 rounded-2xl text-sm border-l-4 border-emerald-50 bg-emerald-50/50 text-emerald-800";
                rationale.innerHTML = `<h4 class="font-bold mb-1">Bravo !</h4> ${data.options[index].r}`;
            } else {
                rationale.className = "mt-6 p-5 rounded-2xl text-sm border-l-4 border-rose-50 bg-rose-50/50 text-rose-800";
                rationale.innerHTML = `<h4 class="font-bold mb-1">Oups...</h4> ${data.options[index].r}`;
            }

            hintBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            
            if (currentQ === quizData.length - 1) {
                nextBtn.innerHTML = `Voir les résultats <i class="fas fa-flag-checkered ml-1"></i>`;
            }
        }

        function updateScore() {
            scoreDisplay.textContent = `Score: ${score}`;
        }

        nextBtn.onclick = () => {
            if (currentQ < quizData.length - 1) {
                currentQ++;
                loadQuestion();
            } else {
                showResults();
            }
        };

        hintBtn.onclick = () => {
            hintBox.textContent = quizData[currentQ].hint;
            hintBox.classList.toggle('hidden');
        };

        function showResults() {
            quizCard.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            progressBar.style.width = '100%';
            document.getElementById('final-score').textContent = `${score} / ${quizData.length}`;
            const msg = document.getElementById('feedback-message');
            if (score === 10) msg.textContent = "Parfait ! Maîtrise totale.";
            else if (score >= 7) msg.textContent = "Excellent travail !";
            else msg.textContent = "Révisions conseillées.";
        }

        function restartQuiz() {
            initQuiz();
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
